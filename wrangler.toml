name = "geotopo-pro"
pages_build_output_dir = "public"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# ── D1 Database ──────────────────────────────────────────────
[[d1_databases]]
binding      = "DB"
database_name = "geotopo-pro-db"
database_id  = "REPLACE_WITH_YOUR_D1_ID"

# ── R2 Bucket ────────────────────────────────────────────────
[[r2_buckets]]
binding     = "R2"
bucket_name = "geotopo-pro-storage"

# ── Secrets (set via: wrangler secret put JWT_SECRET) ────────
# JWT_SECRET = <auto-generated 64-char random string>
